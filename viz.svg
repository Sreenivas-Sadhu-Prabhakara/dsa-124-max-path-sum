<text x="202.0" y="201.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">9</text>
<circle cx="558.0" cy="196.0" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="558.0" y="201.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">20</text>
<circle cx="469.0" cy="258.0" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="469.0" y="263.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">15</text>
<circle cx="647.0" cy="258.0" r="17" fill="#dcfce7" stroke="#16a34a" stroke-width="1.4"/>
<text x="647.0" y="263.0" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#1e293b" text-anchor="middle">7</text>
<line x1="24.0" y1="298.0" x2="736.0" y2="298.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="318.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="322.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="56.0" y="323.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Each node reports the best DOWNWARD chain through it: node + max(left, right, 0) —</text>
<text x="56.0" y="342.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">the 0 clamp discards harmful subtrees. The best BENT path (left + node + right) is</text>
<text x="56.0" y="361.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">recorded as a side effect: at 20 it's 15+20+7.</text>
<text x="72.0" y="396.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">candidates</text>
<rect x="84.0" y="377.0" width="270.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="219.0" y="396.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">20 reports up → 20 + 15 = 35</text>
<rect x="364.0" y="377.0" width="243.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="485.5" y="396.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">bent at 20 → 15+20+7 = 42</text>
<rect x="84.0" y="413.0" width="315.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="241.5" y="432.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">bent at -10 → 35 + (-10) + 9 = 34</text>
<line x1="24.0" y1="457.0" x2="736.0" y2="457.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="477.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="481.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="56.0" y="482.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Answer 42. Two quantities per node — chain (goes up) vs bent path (stays) — is the</text>
<text x="56.0" y="501.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">whole problem; conflating them is the standard wrong answer.</text>
<text x="72.0" y="536.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">answer</text>
